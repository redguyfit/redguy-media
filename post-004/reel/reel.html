<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Archivo Black';src:url('../../tools/archivo-black.woff2') format('woff2');}
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F5F3EE;font-family:Inter,sans-serif;color:#111}
.scene{position:absolute;inset:0;opacity:0;animation:show var(--d) linear var(--s) both}
@keyframes show{0%{opacity:0}0.1%{opacity:1}99.9%{opacity:1}100%{opacity:0}}
.h{font-family:'Archivo Black',sans-serif;text-transform:uppercase;line-height:1}
.red{color:#EF2020}
.pose{position:absolute;animation:slidein .5s cubic-bezier(.2,1.4,.4,1) var(--ps) both}
@keyframes slidein{from{transform:translateX(500px)}to{transform:none}}
.pop{display:inline-block;animation:pop .35s cubic-bezier(.2,1.6,.4,1) var(--w) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.up{animation:up .4s ease-out var(--w) both}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.tag{display:inline-block;background:#EF2020;color:#fff;border-radius:999px;padding:12px 32px;font-size:34px;font-weight:800;letter-spacing:2px}
.bubble{display:inline-block;background:#fff;border:7px solid #111;border-radius:40px 40px 40px 10px;padding:22px 32px;font-size:42px;font-weight:800}
.src{font-size:26px;font-weight:600;color:#444;border-top:5px solid #111;padding-top:18px}
.wm{position:absolute;left:88px;bottom:300px;display:flex;align-items:center;gap:20px;z-index:5}
.wm img{width:96px;height:96px}
.wm div{font-family:'Archivo Black';font-size:40px}
.dark{background:#111;color:#fff}
.bar{position:absolute;left:0;top:0;height:14px;background:#EF2020;animation:bar 10.8s linear 0s both}
@keyframes bar{from{width:0}to{width:1080px}}


@keyframes cut{0%{opacity:1}99.9%{opacity:1}100%{opacity:0}}
.pose{animation-name:zoom;animation-duration:.35s}
@keyframes zoom{from{transform:scale(1.15)}to{transform:none}}
</style></head><body>
<div class="bar"></div>
<div class="scene" style="--s:0s;--d:1.3s;background:#F5F3EE">
  <img src="../../assets/poses/thumbsdown.png" style="position:absolute;height:820px;left:300px;top:960px">
  <div class="h pop" style="--w:0.05s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block">Skinny arms<br><span class="red">in a T&#8209;shirt?</span></div>
</div>
<div class="scene" style="--s:1.3s;--d:1.1s;background:#111">
  <img src="../../assets/poses/crossed.png" style="position:absolute;height:1050px;left:-60px;top:720px;transform:scaleX(-1)">
  <div class="h pop" style="--w:1.35s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Curls<br>every day?</span></div>
</div>
<div class="scene" style="--s:2.4s;--d:1.1s;background:#EF2020">
  <img src="../../assets/poses/thumbsdown.png" style="position:absolute;height:1000px;right:140px;top:760px;transform:scaleX(-1)">
  <div class="h pop" style="--w:2.45s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Wrong<br>muscle.</span></div>
</div>
<div class="scene" style="--s:3.5s;--d:1.6s;background:#F5F3EE">
  <img src="../../assets/poses/point.png" style="position:absolute;height:950px;right:120px;top:800px;transform:scaleX(-1)">
  <div class="h pop" style="--w:3.55s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span class="red">Triceps</span><br>= most of<br>your arm</div>
</div>
<div class="scene" style="--s:5.1s;--d:1.4s;background:#EF2020">
  <img src="../../assets/poses/dumbbell.png" style="position:absolute;height:950px;left:60px;top:800px">
  <div class="h pop" style="--w:5.15s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Arms<br>2× a week</span></div>
</div>
<div class="scene" style="--s:6.5s;--d:1.4s;background:#111">
  <img src="../../assets/poses/flex.png" style="position:absolute;height:900px;left:180px;top:830px">
  <div class="h pop" style="--w:6.55s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Lateral raises<br><span class="red">= wider</span></span></div>
</div>
<div class="scene" style="--s:7.9s;--d:1.3s;background:#F5F3EE">
  <img src="../../assets/poses/eating.png" style="position:absolute;height:950px;left:230px;top:800px">
  <div class="h pop" style="--w:7.95s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block">Eat a bit<br><span class="red">more</span></div>
</div>
<div class="scene" style="--s:9.2s;--d:1.6s;background:#111">
  <img src="../../assets/poses/thumbsup.png" style="position:absolute;height:820px;left:250px;top:880px">
  <div class="h pop" style="--w:9.25s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Save it.<br><span class="red">Follow</span><br>@redguy.fit</span></div>
</div>
<div class="wm"><img src="../../assets/avatar.png"><div><span class="red">RED</span><span id="guy">GUY</span></div></div>
<script>
const darks=[[1300,2400],[2400,3500],[5100,6500],[6500,7900],[9200,99999]];
window.setT=function(ms){document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms;});
const dark=darks.some(([a,b])=>ms>=a&&ms<b);document.getElementById('guy').style.color=dark?'#fff':'#111';
document.querySelector('.wm .red').style.color=(ms>=2400&&ms<3500)||(ms>=5100&&ms<6500)?'#111':'#EF2020';};
</script></body></html><style>.wm{top:150px;bottom:auto!important}</style>
