<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Archivo Black';src:url('../../tools/archivo-black.woff2') format('woff2');}
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F5F3EE;font-family:Inter,sans-serif;color:#111}
.scene{position:absolute;inset:0;opacity:0;animation:show var(--d) linear var(--s) both}
@keyframes show{0%{opacity:0}0.1%{opacity:1}99.9%{opacity:1}100%{opacity:0}}
.h{font-family:'Archivo Black',sans-serif;text-transform:uppercase;line-height:1}
.red{color:#EF2020}
.pose{position:absolute;animation:slidein .5s cubic-bezier(.2,1.4,.4,1) var(--ps) both}
@keyframes slidein{from{transform:translateX(500px)}to{transform:none}}
.pop{display:inline-block;animation:pop .35s cubic-bezier(.2,1.6,.4,1) var(--w) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.up{animation:up .4s ease-out var(--w) both}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.tag{display:inline-block;background:#EF2020;color:#fff;border-radius:999px;padding:12px 32px;font-size:34px;font-weight:800;letter-spacing:2px}
.bubble{display:inline-block;background:#fff;border:7px solid #111;border-radius:40px 40px 40px 10px;padding:22px 32px;font-size:42px;font-weight:800}
.src{font-size:26px;font-weight:600;color:#444;border-top:5px solid #111;padding-top:18px}
.wm{position:absolute;left:88px;bottom:300px;display:flex;align-items:center;gap:20px;z-index:5}
.wm img{width:96px;height:96px}
.wm div{font-family:'Archivo Black';font-size:40px}
.dark{background:#111;color:#fff}
.bar{position:absolute;left:0;top:0;height:14px;background:#EF2020;animation:bar 10.4s linear 0s both}
@keyframes bar{from{width:0}to{width:1080px}}


@keyframes cut{0%{opacity:1}99.9%{opacity:1}100%{opacity:0}}
.pose{animation-name:zoom;animation-duration:.35s}
@keyframes zoom{from{transform:scale(1.15)}to{transform:none}}
</style></head><body>
<div class="bar"></div>
<div class="scene" style="--s:0s;--d:1.2s;background:#F5F3EE">
  <img src="../../assets/poses/incline-press.png" style="position:absolute;height:640px;left:200px;top:1000px">
  <div class="h pop" style="--w:0.05s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block">Shoulder<br><span class="red">pinch</span> on<br>bench?</div>
</div>
<div class="scene" style="--s:1.2s;--d:1.1s;background:#111">
  <img src="../../assets/poses/thumbsdown.png" style="position:absolute;height:1000px;left:-40px;top:760px;transform:scaleX(-1)">
  <div class="h pop" style="--w:1.25s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Elbows<br><span class="red">flared?</span></span></div>
</div>
<div class="scene" style="--s:2.3s;--d:1.3s;background:#EF2020">
  <img src="../../assets/poses/crossed.png" style="position:absolute;height:1050px;right:60px;top:720px">
  <div class="h pop" style="--w:2.35s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Tuck them<br>in a bit</span></div>
</div>
<div class="scene" style="--s:3.6s;--d:1.3s;background:#F5F3EE">
  <img src="../../assets/poses/point.png" style="position:absolute;height:950px;left:40px;top:800px">
  <div class="h pop" style="--w:3.65s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block">Blades<br><span class="red">back &amp;<br>down</span></div>
</div>
<div class="scene" style="--s:4.9s;--d:1.3s;background:#111">
  <img src="../../assets/poses/dumbbell.png" style="position:absolute;height:950px;right:140px;top:800px;transform:scaleX(-1)">
  <div class="h pop" style="--w:4.95s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Bar to<br><span class="red">lower chest</span></span></div>
</div>
<div class="scene" style="--s:6.2s;--d:1.3s;background:#EF2020">
  <img src="../../assets/poses/thumbsup.png" style="position:absolute;height:880px;left:120px;top:860px;transform:scaleX(-1)">
  <div class="h pop" style="--w:6.25s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Tuck.<br><span style="color:#111">Squeeze.</span><br>Lower chest.</span></div>
</div>
<div class="scene" style="--s:7.5s;--d:1.3s;background:#F5F3EE">
  <img src="../../assets/poses/crossed.png" style="position:absolute;height:1000px;left:-80px;top:760px;transform:scaleX(-1)">
  <div class="h pop" style="--w:7.55s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block">Sharp pain?<br><span class="red">See a<br>physio.</span></div>
</div>
<div class="scene" style="--s:8.8s;--d:1.6s;background:#111">
  <img src="../../assets/poses/flex.png" style="position:absolute;height:900px;left:180px;top:830px">
  <div class="h pop" style="--w:8.85s;position:absolute;left:88px;right:120px;top:340px;text-align:center;font-size:104px;display:block"><span style="color:#fff">Save it.<br><span class="red">Follow</span><br>@redguy.fit</span></div>
</div>
<div class="wm"><img src="../../assets/avatar.png"><div><span class="red">RED</span><span id="guy">GUY</span></div></div>
<script>
const darks=[[1200,2300],[2300,3600],[4900,6200],[6200,7500],[8800,99999]];
const reds=[[2300,3600],[6200,7500]];
window.setT=function(ms){document.getAnimations().forEach(a=>{a.pause();a.currentTime=ms;});
const dark=darks.some(([a,b])=>ms>=a&&ms<b);document.getElementById('guy').style.color=dark?'#fff':'#111';
document.querySelector('.wm .red').style.color=reds.some(([a,b])=>ms>=a&&ms<b)?'#111':'#EF2020';};
</script></body></html><style>.wm{top:150px;bottom:auto!important}</style>
